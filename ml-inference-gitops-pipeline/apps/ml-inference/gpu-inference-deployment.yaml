apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-inference-api
  namespace: default
  labels:
    app: gpu-inference-api
spec:
  replicas: 1
  strategy:
   type: Recreate
  selector:
    matchLabels:
      app: gpu-inference-api
  template:
    metadata:
      labels:
        app: gpu-inference-api
    spec: 
      imagePullSecrets:
      - name: ghcr-secret
      nodeSelector:
        kubernetes.io/hostname: mlops-labs-worker2
      containers:
      - name: api
        image: ghcr.io/sgangavarapu4/gpu-inference-api:v1.0.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install --no-cache-dir fastapi uvicorn && \
          python3 -c '
          import torch
          from fastapi import FastAPI
          import uvicorn

          app = FastAPI()

          @app.get("/health")
          def health():
              return {
                  "status": "ok",
                  "gpu_available": torch.cuda.is_available(),
                  "device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else "None"
              }

          @app.get("/infer")
          def infer():
              x = torch.rand(1000, 1000, device="cuda")
              y = torch.matmul(x, x)
              return {"status": "success", "tensor_sum": float(y.sum())}

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=8000)
          '
        ports:
        - containerPort: 8000
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/lib/wsl/lib:/usr/lib/wsl/drivers
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "4Gi"
            cpu: "2"
          requests:
            nvidia.com/gpu: "1"
            memory: "2Gi"
            cpu: "1"
        securityContext:
          privileged: true
        volumeMounts:
        - name: wsl-driver
          mountPath: /usr/lib/wsl
        - name: dev-dxg
          mountPath: /dev/dxg
      volumes:
      - name: wsl-driver
        hostPath:
          path: /usr/lib/wsl
      - name: dev-dxg
        hostPath:
          path: /dev/dxg
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-inference-api
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: gpu-inference-api