apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: inferance-autoscaler
 namespace: default
spec:
 scaleTargetRef:
  apiVersion: apps/v1
  kind: Deployment
  name: ml-inference-api

 minReplicas: 3
 maxReplicas: 10

 metrics:
 - type: Resource
   resource:
    name: cpu
    target: 
     type: Utilization
     averageUtilization: 50