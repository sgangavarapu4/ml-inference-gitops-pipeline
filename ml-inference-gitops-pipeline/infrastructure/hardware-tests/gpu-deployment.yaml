apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-inferance-name
  labels:                  # <-- Make sure this 'l' is lowercase
    app: inferance 
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: inferance 
  template:
    metadata:
      labels:              # <-- Make sure this 'l' is lowercase too
        app: inferance
    spec:
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "ml-core"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/gpu
                operator: In
                values: 
                - nvidia-h100
      containers:
      - name: fastapi-predictior
        image: nginx:alpine
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
            
          limits:
            cpu: "1" 
            memory: "1Gi"
            
            
            
---
apiVersion: v1
kind: Service 
metadata:
  name: inferance-anypoint
spec:
  type: ClusterIP
  selector:
    app: inferance 
  ports:
  - port: 80
    targetPort: 80


            


         



